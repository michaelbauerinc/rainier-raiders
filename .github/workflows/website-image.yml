name: Publish website image

on:
  push:
    branches: [main]
    paths:
      - apps/website/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .npmrc
      - .dockerignore
      - .github/workflows/website-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: website-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push website
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/website/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/michaelbauerinc/rainier-raiders-website:sha-${{ github.sha }}
            ghcr.io/michaelbauerinc/rainier-raiders-website:latest
          labels: |
            org.opencontainers.image.source=https://github.com/michaelbauerinc/rainier-raiders
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
